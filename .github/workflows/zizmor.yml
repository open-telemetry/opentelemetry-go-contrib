name: Zizmor

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '9 22 * * 5' # weekly at 22:09 UTC on Friday
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    permissions:
      contents: read # for actions/checkout
      security-events: write # for zizmor to upload SARIF results
    uses: open-telemetry/shared-workflows/.github/workflows/zizmor.yml@71c77e7624e3dccefec108b135186c22e5d9d69b # v0.9.0
